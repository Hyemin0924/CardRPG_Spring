server.port=5000
server.address=0.0.0.0

spring.jackson.property-naming-strategy=SNAKE_CASE

logging.level.game_logger=INFO
logging.pattern.console=[%d{yyyy-MM-dd HH:mm:ss}] [%-5level] %msg%n

# ===================== 전투 기록 저장용 DB (H2 파일 모드) =====================
# ./data/cardgame.mv.db 파일 하나에 저장된다. 서버를 재시작해도 기록이 유지된다.
# AUTO_SERVER=TRUE 로 두면 서버 실행 중에도 외부 도구로 같은 파일을 열어볼 수 있다.
spring.datasource.url=jdbc:h2:file:./data/cardgame;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# http://localhost:5000/h2-console 에서 위 datasource URL 로 접속하면 표를 직접 볼 수 있다.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
